name: 功能建议
description: 提议新的能力或现有体验改进
title: "[Feature]: "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有相同建议。
          required: true
        - label: 这个建议与 Locus 的 Wi-Fi 声音自动化定位相关。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 请先说明希望解决的问题，而不仅是具体实现方式。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述期望的交互、行为和结果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息
      description: 可以添加草图、截图或相关资料。
